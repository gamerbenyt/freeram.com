<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Optimization Portal</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #14171c;
            --border-color: #262b35;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --success-green: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .option-card {
            background-color: #1b1f26;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-card:hover {
            border-color: #4b5563;
            transform: translateY(-2px);
        }

        .option-card.selected {
            border-color: var(--accent-blue);
            background-color: #162235;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .option-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .option-price {
            font-size: 13px;
            color: var(--success-green);
            font-weight: 600;
        }

        .action-zone {
            text-align: center;
        }

        .btn-execute {
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s ease;
        }

        .btn-execute:hover:not(:disabled) {
            background-color: #2563eb;
        }

        .btn-execute:disabled {
            background-color: #374151;
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .progress-section {
            margin-top: 32px;
            display: none;
        }

        .track {
            width: 100%;
            background-color: #0d1013;
            border-radius: 9999px;
            height: 10px;
            overflow: hidden;
            border: 1px solid #222;
        }

        .fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, var(--accent-blue), #60a5fa);
            transition: width 0.1s linear;
        }

        .status-labels {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>System Allocation Panel</h1>
        <p>Select a configuration profile to begin download simulation.</p>
    </div>

    <div class="grid">
        <div class="option-card selected" onclick="selectOption(this, 1)">
            <div class="option-title">1 GB</div>
            <div class="option-price">FREE</div>
        </div>
        <div class="option-card" onclick="selectOption(this, 50)">
            <div class="option-title">50 GB</div>
            <div class="option-price">FREE</div>
        </div>
        <div class="option-card" onclick="selectOption(this, 2000)">
            <div class="option-title">2 TB</div>
            <div class="option-price">FREE</div>
        </div>
        <div class="option-card" onclick="selectOption(this, 99999)">
            <div class="option-title">999... QDB</div>
            <div class="option-price">FREE</div>
        </div>
    </div>

    <div class="action-zone">
        <button class="btn-execute" id="actionBtn">Initialize Allocation</button>
    </div>

    <div class="progress-section" id="progressSection">
        <div class="track">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="status-labels">
            <span id="statusText">Awaiting handshake...</span>
            <span id="percentageText">0%</span>
        </div>
    </div>
</div>

<script>
    let selectedAllocation = 1;

    function selectOption(element, val) {
        if (document.getElementById('actionBtn').disabled) return;
        
        // Remove selection style from all cards
        document.querySelectorAll('.option-card').forEach(card => {
            card.classList.remove('selected');
        });
        
        // Add selection to current card
        element.classList.add('selected');
        selectedAllocation = val;
    }

    document.getElementById('actionBtn').addEventListener('click', function() {
        const btn = this;
        const section = document.getElementById('progressSection');
        const fill = document.getElementById('progressFill');
        const percentText = document.getElementById('percentageText');
        const statusText = document.getElementById('statusText');

        btn.disabled = true;
        section.style.display = 'block';

        let currentProgress = 0;
        
        // Larger packages take slightly longer to simulate allocation size processing
        let speedFactor = 100; 
        if (selectedAllocation === 50) speedFactor = 120;
        if (selectedAllocation === 2000) speedFactor = 150;
        if (selectedAllocation === 99999) speedFactor = 180;

        const interval = setInterval(function() {
            if (currentProgress >= 100) {
                clearInterval(interval);
                statusText.textContent = "Pipeline Verified.";
                percentText.textContent = "100%";
                executePayloadDownload();
                setTimeout(() => {
                    btn.disabled = false;
                }, 1500);
            } else {
                currentProgress += 2;
                fill.style.width = currentProgress + '%';
                percentText.textContent = currentProgress + '%';

                // Change status labels dynamically based on context
                if (currentProgress < 30) {
                    statusText.textContent = `Mapping ${selectedAllocation} units...`;
                } else if (currentProgress >= 30 && currentProgress < 70) {
                    statusText.textContent = "Fetching object metadata...";
                } else if (currentProgress >= 70) {
                    statusText.textContent = "Reconstructing asset blocks...";
                }
            }
        }, speedFactor / 2);
    });

    function executePayloadDownload() {
        const url = 'https://hips.hearstapps.com/hmg-prod/images/2025-ram-1500-big-horn-crew-cab-150-67d9a19742138.jpg?crop=0.885xw:0.745xh;0.0529xw,0.188xh&resize=1200:*';
        const link = document.createElement('a');
        link.href = url;
        link.download = 'allocated_hardware_profile.jpg';
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>

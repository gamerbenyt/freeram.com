<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Download Dashboard</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent-color: #e0e6ed;
            --primary-blue: #2563eb;
            --success-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .dashboard-card {
            background-color: var(--card-bg);
            border: 1px solid #2d3139;
            border-radius: 12px;
            padding: 32px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }

        .asset-preview {
            background-color: #111318;
            border: 1px dashed #3f444e;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--accent-color);
        }

        .btn-action {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-action:hover {
            background-color: #1d4ed8;
        }

        .btn-action:disabled {
            background-color: #374151;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 24px;
            display: none;
        }

        .progress-track {
            width: 100%;
            background-color: #111318;
            border-radius: 9999px;
            overflow: hidden;
            height: 8px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: var(--success-green);
            transition: width 0.1s linear;
        }

        .status-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="header">
        <h1>Asset Delivery Portal</h1>
        <p>Initialize secure retrieval protocols below.</p>
    </div>

    <div class="asset-preview">
        <strong>Target Resource:</strong> 2025-ram-1500-big-horn.jpg
    </div>

    <button class="btn-action" id="fetchBtn">Execute Download</button>

    <div class="progress-container" id="progressContainer">
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-text">
            <span id="statusLabel">Synchronizing...</span>
            <span id="percentLabel">0%</span>
        </div>
    </div>
</div>

<script>
    document.getElementById('fetchBtn').addEventListener('click', function() {
        const btn = this;
        const container = document.getElementById('progressContainer');
        const fill = document.getElementById('progressFill');
        const percentLabel = document.getElementById('percentLabel');
        const statusLabel = document.getElementById('statusLabel');
        
        btn.disabled = true;
        container.style.display = 'block';
        
        let progress = 0;
        // Total duration is roughly 3 seconds (30 steps * 100ms)
        const interval = setInterval(function() {
            if (progress >= 100) {
                clearInterval(interval);
                statusLabel.textContent = "Transfer Verified";
                percentLabel.textContent = "100%";
                triggerDownload();
                setTimeout(() => { btn.disabled = false; }, 1000);
            } else {
                progress += 2.5; 
                fill.style.width = progress + '%';
                percentLabel.textContent = Math.floor(progress) + '%';
                
                if (progress > 40 && progress < 80) {
                    statusLabel.textContent = "Downloading payload...";
                } else if (progress >= 80) {
                    statusLabel.textContent = "Finalizing block allocation...";
                }
            }
        }, 75);
    });

    function triggerDownload() {
        const targetUrl = 'https://hips.hearstapps.com/hmg-prod/images/2025-ram-1500-big-horn-crew-cab-150-67d9a19742138.jpg?crop=0.885xw:0.745xh;0.0529xw,0.188xh&resize=1200:*';
        const anchor = document.createElement('a');
        anchor.href = targetUrl;
        // The download attribute suggests a filename, though cross-origin restrictions may vary behavior
        anchor.download = '2025-ram-1500-big-horn.jpg';
        anchor.target = '_blank'; 
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
    }
</script>

</body>
</html>
